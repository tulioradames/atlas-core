<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Atlas | Smart Field Management
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <meta content="Atlas &mdash; Smart Field Management. Plataforma inteligente para documenta&ccedil;&atilde;o e gest&atilde;o de opera&ccedil;&otilde;es em campo." name="description"/>
  <meta content="Atlas | Smart Field Management" property="og:title"/>
  <meta content="Plataforma inteligente para documenta&ccedil;&atilde;o e gest&atilde;o de opera&ccedil;&otilde;es em campo." property="og:description"/>
  <meta content="website" property="og:type"/>
  <link href="assets/icons/favicon.ico?v=1.4.0-oficial" rel="icon" sizes="any"/>
  <link href="assets/icons/icon-32.png?v=1.4.0-oficial" rel="icon" sizes="32x32" type="image/png"/>
  <link href="assets/icons/icon-192.png?v=1.4.0-oficial" rel="apple-touch-icon"/>
  <meta content="assets/icons/icon-192.png?v=1.4.0-oficial" property="og:image"/>
  <link href="manifest.webmanifest" rel="manifest"/>
  <link href="css/main.css?v=1.4.0-oficial" rel="stylesheet"/>
 </head>
 <body class="bg-[#1c1d30] m-0 p-0 overflow-hidden text-gray-200 font-sans text-xs flex flex-col h-screen">
  <div id="atlas-auth-root" class="atlas-auth-root"></div>
  <div id="atlas-operation-root" class="atlas-operation-root" aria-live="polite" aria-hidden="true"></div>
  <!-- BARRA DE STATUS -->
  <div class="bg-[#0073ea] text-white text-center py-2 font-semibold text-xs z-50 transition-all" id="status-banco-alerta">
   🔄 Sincronizando com a nuvem Supabase...
  </div>
  <!-- CORPO PRINCIPAL -->
  <div class="flex flex-1 overflow-hidden select-none relative">
   <!-- BARRA LATERAL RETRÁTIL (CIDADES / OBRAS) -->
   <div class="w-72 bg-[#20223b] border-r border-[#2f314e] flex flex-col shrink-0 sidebar-transition relative overflow-hidden" id="sidebar-container">
    <!-- CABEÇALHO DA SIDEBAR -->
    <div class="p-4 border-b border-[#2f314e] flex items-center justify-between min-w-[280px]">
     <div class="atnx-brand-block">
      <img alt="Atlas — Smart Field Management" class="atnx-logo-horizontal" src="assets/brand/atnx-logo-horizontal.svg"/>
     </div>
     <button class="text-gray-400 hover:text-white p-1 text-sm font-bold" id="btn-fechar-sidebar" onclick="toggleSidebar()" title="Recolher Menu">
      ✕
     </button>
    </div>
    <!-- BUSCA E ADIÇÃO -->
    <div class="p-3 min-w-[280px]">
     <div class="flex gap-2">
      <div class="relative flex-1 flex items-center">
       <span class="absolute left-3 text-gray-500">
        🔍
       </span>
       <input class="w-full bg-[#18192b] border border-[#3d4066] rounded pl-8 pr-2 py-1.5 text-xs focus:outline-none focus:border-[#0073ea] text-gray-300" id="search-input" oninput="handleSearch(this.value)" placeholder="Pesquisar..." type="text"/>
      </div>
      <button class="w-8 h-8 bg-[#0073ea] hover:bg-[#0073ea] text-white rounded flex items-center justify-center font-bold text-lg shrink-0 transition-all active:scale-95" onclick="criarNovoItemSidebar()" title="Adicionar item">
       +
      </button>
      <button class="w-8 h-8 bg-[#2f314e] hover:bg-[#3d4066] text-white rounded flex items-center justify-center font-bold text-sm shrink-0 transition-all active:scale-95" id="btn-importar-drive-sidebar" onclick="importarPastaDrive()" title="Reconhecer pasta do Google Drive">
       ☁
      </button>
     </div>
    </div>
    <!-- NAVEGAÇÃO DE MÓDULOS -->
    <div class="px-3 pb-3 min-w-[280px] border-b border-[#2f314e]">
     <div class="text-[10px] uppercase tracking-[0.14em] text-gray-500 font-bold mb-2">Módulos</div>
     <div class="space-y-1">
      <button class="atnx-sidebar-module active" id="btn-modulo-admin-obras" onclick="alternarModulo('admin_obras')">
       <span class="atnx-module-caret">▸</span><span>Documentação Rede Geral</span>
      </button>
      <div class="atnx-sidebar-submodules" id="submenu-admin-obras">
       <button class="atnx-sidebar-submodule" id="btn-sub-admin-status" onclick="definirSubmoduloAdmin('status')">Status</button>
       <button class="atnx-sidebar-submodule" id="btn-sub-admin-gantt" onclick="definirSubmoduloAdmin('gantt')">Gantt</button>
       <button class="atnx-sidebar-submodule" id="btn-sub-admin-obras" onclick="definirSubmoduloAdmin('obras')">Obras</button>
       <button class="atnx-sidebar-submodule" id="btn-sub-admin-painel" onclick="definirSubmoduloAdmin('painel')">Painel</button>
       <button class="atnx-sidebar-submodule" id="btn-sub-admin-manutencao-redes" onclick="definirSubmoduloAdmin('manutencao_redes')">Manutenção de Redes</button>
      </div>
      <button class="atnx-sidebar-module" id="btn-modulo-expansoes" onclick="alternarModulo('expansoes')">
       <span class="atnx-module-caret">▸</span><span>Expansões</span>
      </button>
      <div class="atnx-sidebar-submodules" id="submenu-expansoes">
       <button class="atnx-sidebar-submodule" id="btn-sub-exp-projetos" onclick="definirSubmoduloExpansoes('tabela')">Projetos</button>
       <button class="atnx-sidebar-submodule" id="btn-sub-exp-gantt" onclick="definirSubmoduloExpansoes('gantt')">Gantt</button>
       <button class="atnx-sidebar-submodule" id="btn-sub-exp-obras" onclick="definirSubmoduloExpansoes('obras')">Obras</button>
      </div>
      <button class="atnx-sidebar-module" id="btn-modulo-pmo" onclick="alternarModulo('pmo')">
       <span class="atnx-module-caret">▸</span><span>PMO</span>
      </button>
      <div class="atnx-sidebar-submodules" id="submenu-pmo">
       <button class="atnx-sidebar-submodule" id="btn-sub-pmo-analise" onclick="definirSubmoduloPMO('analise_novos_projetos')">Análise de Novos Projetos</button>
      </div>
      <button class="atnx-sidebar-module hidden" id="btn-modulo-admin-central" onclick="alternarModulo('admin_central')">
       <span class="atnx-module-caret">▸</span><span>Administração</span>
      </button>
     </div>
    </div>

    <!-- LISTAGEM DE CIDADES / OBRAS DA DOCUMENTAÇÃO -->
    <div id="sidebar-obras-section" class="flex flex-col flex-1 overflow-hidden min-w-[280px]">
     <div class="px-3 pt-3">
      <div class="text-[10px] uppercase tracking-[0.14em] text-gray-500 font-bold mb-2" id="sidebar-obras-title">Obras cadastradas</div>
     </div>
     <div class="flex-1 overflow-y-auto px-2 space-y-0.5" id="sidebar-obras">
     </div>
    </div>
   </div>
   <!-- BOTÃO FLUTUANTE PARA ABRIR SIDEBAR (QUANDO FECHADA) -->
   <button class="hidden absolute left-3 top-4 z-40 bg-[#20223b] hover:bg-[#2f314e] border border-[#2f314e] text-white w-8 h-8 rounded flex items-center justify-center text-sm shadow-md transition-all font-bold" id="btn-abrir-sidebar" onclick="toggleSidebar()">
    ☰
   </button>
   <!-- CONTEÚDO PRINCIPAL -->
   <div class="flex-1 flex flex-col overflow-hidden bg-[#18192b]">
    <div class="p-6 bg-[#1c1d30] border-b border-[#2f314e] shrink-0 transition-all" id="header-conteudo">
     <div class="flex justify-between items-start mb-4">
      <h1 class="text-2xl font-semibold text-white tracking-wide" id="txt-nome-obra">
       Buscando dados...
      </h1>
      <div class="flex gap-2">
       <button class="bg-[#0073ea] hover:bg-[#0073ea] text-white px-4 py-2 rounded text-xs font-medium flex items-center gap-1.5 shadow-md" id="btn-adicionar-ativo" onclick="criarElementoPai()">
        Adicionar ativo
       </button>
       <button class="hidden bg-[#0073ea] hover:bg-[#0073ea] text-white px-4 py-2 rounded text-xs font-medium items-center gap-1.5 shadow-md" id="btn-adicionar-cidade-admin" onclick="abrirCadastroCidadeAdmin()">
        Cadastrar cidade
       </button>
       <button class="hidden bg-[#0073ea] hover:bg-[#0073ea] text-white px-4 py-2 rounded text-xs font-medium items-center gap-1.5 shadow-md" id="btn-adicionar-expansao" onclick="alternarFormularioExpansaoInline()">
        Preencher projeto
       </button>
       <button class="hidden atnx-auditoria-icon-btn" id="btn-importar-drive-expansoes-icon" onclick="importarObraExpansoesPorLinkDrive()" title="Importar obra pelo Drive" aria-label="Importar obra pelo Drive">
        ☁
       </button>
       <button class="hidden bg-[#0073ea] hover:bg-[#0073ea] text-white px-4 py-2 rounded text-xs font-medium items-center gap-1.5 shadow-md" id="btn-snapshot-semanal" onclick="registrarSnapshotSemanal()">
        Registrar semana
       </button>
       <button class="atnx-auditoria-icon-btn" id="btn-auditoria-icon" onclick="abrirAuditoria()" title="Auditoria de alterações" aria-label="Abrir auditoria de alterações">
        🧾
       </button>
      </div>
     </div>
     <div class="flex gap-2 border-b border-[#2f314e] pb-px" id="tabs-container">
     </div>
    </div>
    <!-- TABELA CENTRAL -->
    <div class="flex-1 overflow-auto p-6" id="main-scroll-container">
     <div class="min-w-[1100px] bg-[#1c1d30] rounded border border-[#2f314e] overflow-hidden shadow-2xl" id="painel-documentacao">
      <div class="bg-[#242746] px-4 py-2.5 font-bold text-[#0073ea] border-b border-[#2f314e]" id="txt-grupo-ativo">
      </div>
      <table class="w-full text-left text-xs border-collapse">
       <thead>
        <tr class="bg-[#1c1d30] text-gray-400 border-b border-[#2f314e] h-9 text-[11px]">
         <th class="w-10 text-center">
          <input id="check-todos-elementos" class="rounded accent-[#0073ea]" type="checkbox" onclick="toggleSelecaoTodos(this.checked)" title="Selecionar todos os ativos visíveis"/>
         </th>
         <th class="w-2/5 font-normal px-4 border-r border-[#2f314e]">
          Elemento Ativo
         </th>
         <th class="w-36 font-normal px-4 border-r border-[#2f314e] text-center">
          Status
         </th>
         <th class="w-32 font-normal px-4 border-r border-[#2f314e] text-center">
          Data
         </th>
         <th class="font-normal px-4 border-r border-[#2f314e]">
          Respons&aacute;vel
         </th>
         <th class="w-16 text-center">
          A&ccedil;&otilde;es
         </th>
        </tr>
       </thead>
       <tbody id="tabela-elementos">
       </tbody>
      </table>
     </div>
     <div class="hidden min-w-[1100px]" id="painel-admin-obras"></div>
     <div class="hidden min-w-[1100px]" id="painel-expansoes"></div>
     <div class="hidden min-w-[1100px]" id="painel-pmo"></div>
     <div class="hidden min-w-[1100px]" id="painel-manutencao-redes"></div>
     <div class="hidden min-w-[1100px]" id="painel-admin-central"></div>
     <div class="hidden min-w-[1100px]" id="painel-auditoria"></div>
    </div>
   </div>
  </div>
  <!-- AUDITORIA COMO ÍCONE / PAINEL LATERAL -->
  <div class="atlas-auditoria-overlay hidden" id="atlas-auditoria-overlay" onclick="fecharAuditoria(event)">
   <aside class="atlas-auditoria-drawer" role="dialog" aria-modal="true" aria-labelledby="atlas-auditoria-title" onclick="event.stopPropagation()">
    <div class="atlas-auditoria-head">
     <div>
      <div class="atlas-auditoria-kicker">Histórico</div>
      <h2 id="atlas-auditoria-title">Auditoria</h2>
      <p>Alterações importantes registradas no Atlas.</p>
     </div>
     <button class="atlas-auditoria-close" onclick="fecharAuditoria()" title="Fechar auditoria" aria-label="Fechar auditoria">×</button>
    </div>
    <div class="atlas-auditoria-filter">
     <span>🔎</span>
     <input id="atlas-auditoria-search" type="text" placeholder="Pesquisar na auditoria..." oninput="filtrarAuditoria(this.value)"/>
    </div>
    <div class="atlas-auditoria-body" id="atlas-auditoria-body"></div>
   </aside>
  </div>

  <!-- RODAPÉ DE COPYRIGHT -->
  <div id="atlas-footer" class="bg-[#141524] border-t border-[#2f314e] px-4 py-2 flex items-center justify-between text-gray-500 text-[10px] select-none shrink-0 z-50">
   <div>
    &copy; 2026
    <span class="atnx-footer-brand">
     Atlas
    </span>
    &mdash; Smart Field Management. Edição pública
   </div>
   <div class="flex items-center gap-3">
   <span class="px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20" id="badge-status">
     Conectando...
    </span>
    <span class="atlas-user-chip hidden" id="atlas-user-chip">Usuário</span>
    <button class="atlas-logout-btn hidden" id="btn-logout-atlas" onclick="sairAtlas()" title="Sair do Atlas">Sair</button>
    <button class="atnx-theme-toggle" id="btn-theme-atnx" onclick="alternarTemaAtnx()" title="Alternar tema">Escuro</button>
    <span class="atnx-version-badge">
     V 1.4.0 Oficial
    </span>
   </div>
  </div>
  <script src="config/config.js">
  </script>
  <script src="js/app.js?v=1.4.0-oficial">
  </script>
 </body>
</html>
