<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Atlas 2.1 | Smart Field Management</title>
  <meta name="description" content="Atlas 2.1 — plataforma configurável de gestão operacional, campo e arquivos.">
  <meta name="author" content="Túlio Radamés">
  <meta name="application-name" content="Atlas 2.1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="stylesheet" href="css/v2.css?v=2.1.0">
</head>
<body class="atlas-v2-auth-locked">
  <div class="atlas-v2-auth-root" id="atlas-v2-auth-root" aria-live="polite"></div>

  <div class="atlas-v2-app" id="atlas-v2-app" hidden>
    <aside class="atlas-v2-sidebar" id="atlas-v2-sidebar" aria-label="Navegação principal">
      <header class="atlas-v2-sidebar-head">
        <a class="atlas-v2-brand" href="index.html" aria-label="Atlas 2.1">
          <img src="assets/brand/atnx-logo-horizontal.svg" alt="Atlas">
        </a>
        <button class="atlas-v2-icon-button atlas-v2-sidebar-toggle" type="button" data-action="toggle-sidebar" title="Recolher menu" aria-label="Recolher menu">
          <i data-lucide="panel-left-close"></i>
        </button>
      </header>

      <div class="atlas-v2-workspace-switcher">
        <button type="button" class="atlas-v2-workspace-current" data-action="workspace-menu" aria-haspopup="true">
          <span class="atlas-v2-workspace-mark" id="atlas-v2-workspace-mark">O</span>
          <span><small>Núcleo operacional</small><strong id="atlas-v2-workspace-name">Operações</strong></span>
          <i data-lucide="chevrons-up-down"></i>
        </button>
      </div>

      <div class="atlas-v2-sidebar-tools">
        <label class="atlas-v2-search-field">
          <i data-lucide="search"></i>
          <input id="atlas-v2-nav-search" type="search" placeholder="Localizar rota" autocomplete="off">
        </label>
        <button class="atlas-v2-icon-button atlas-v2-primary-icon" type="button" data-action="open-create" title="Criar" aria-label="Criar área, módulo ou quadro">
          <i data-lucide="plus"></i>
        </button>
      </div>

      <nav class="atlas-v2-navigation" id="atlas-v2-navigation"></nav>

      <footer class="atlas-v2-sidebar-footer">
        <button class="atlas-v2-user-button" type="button" data-action="user-menu">
          <span class="atlas-v2-avatar" id="atlas-v2-user-avatar">TR</span>
          <span><strong id="atlas-v2-user-name">Túlio Radamés</strong><small id="atlas-v2-user-role">Admin</small></span>
          <i data-lucide="more-horizontal"></i>
        </button>
      </footer>
    </aside>

    <button class="atlas-v2-sidebar-backdrop" type="button" data-action="close-sidebar" aria-label="Fechar menu"></button>

    <main class="atlas-v2-main">
      <header class="atlas-v2-topbar">
        <div class="atlas-v2-topbar-left">
          <button class="atlas-v2-icon-button atlas-v2-menu-button" type="button" data-action="open-sidebar" title="Abrir menu" aria-label="Abrir menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="atlas-v2-breadcrumb" id="atlas-v2-breadcrumb"></div>
        </div>
        <div class="atlas-v2-topbar-actions">
          <button class="atlas-v2-command" type="button" data-action="global-search" title="Busca global">
            <i data-lucide="search"></i><span>Buscar</span><kbd>Ctrl K</kbd>
          </button>
          <a class="atlas-v2-icon-button" href="manual.html" target="_blank" rel="noopener" title="Manual de utilização" aria-label="Abrir manual de utilização">
            <i data-lucide="circle-help"></i>
          </a>
          <button class="atlas-v2-icon-button" type="button" data-action="notifications" title="Notificações" aria-label="Notificações">
            <i data-lucide="bell"></i><span class="atlas-v2-notification-dot"></span>
          </button>
          <button class="atlas-v2-icon-button" type="button" data-action="toggle-theme" title="Alternar tema" aria-label="Alternar tema">
            <i data-lucide="moon"></i>
          </button>
        </div>
      </header>

      <section class="atlas-v2-board-head">
        <div class="atlas-v2-board-title-row">
          <div class="atlas-v2-board-identity">
            <span class="atlas-v2-board-icon" id="atlas-v2-board-icon"><i data-lucide="table-2"></i></span>
            <div class="atlas-v2-board-copy">
              <div class="atlas-v2-board-kicker"><span>Quadro operacional</span><code id="atlas-v2-board-code">AT-0000</code></div>
              <div class="atlas-v2-board-title-line">
                <h1 id="atlas-v2-board-title">Carregando quadro</h1>
                <span class="atlas-v2-access-badge" id="atlas-v2-access-badge">Organizacional</span>
              </div>
              <p id="atlas-v2-board-description"></p>
            </div>
          </div>
          <div class="atlas-v2-board-actions">
            <button class="atlas-v2-button atlas-v2-button-quiet" type="button" data-action="share-board"><i data-lucide="users"></i><span>Compartilhar</span></button>
            <button class="atlas-v2-icon-button" type="button" data-action="board-settings" title="Configurar quadro" aria-label="Configurar quadro"><i data-lucide="settings-2"></i></button>
          </div>
        </div>
        <div class="atlas-v2-view-tabs" id="atlas-v2-view-tabs"></div>
      </section>

      <section class="atlas-v2-board-toolbar" aria-label="Ferramentas do quadro">
        <div class="atlas-v2-toolbar-main">
          <button class="atlas-v2-button atlas-v2-button-primary" type="button" data-action="add-item"><i data-lucide="plus"></i><span>Novo item</span></button>
          <button class="atlas-v2-button atlas-v2-button-quiet atlas-v2-mobile-field-action" type="button" data-action="field-mode-toggle"><i data-lucide="smartphone"></i><span>Campo</span></button>
          <button class="atlas-v2-button atlas-v2-button-quiet atlas-v2-mobile-field-action" type="button" data-action="import"><i data-lucide="file-up"></i><span>Importar</span></button>
          <button class="atlas-v2-button atlas-v2-button-quiet" type="button" data-action="add-group"><i data-lucide="rows-3"></i><span>Novo grupo</span></button>
          <button class="atlas-v2-button atlas-v2-button-quiet" type="button" data-action="add-column"><i data-lucide="columns-3"></i><span>Nova coluna</span></button>
          <span class="atlas-v2-toolbar-divider"></span>
          <label class="atlas-v2-inline-search">
            <i data-lucide="search"></i>
            <input id="atlas-v2-board-search" type="search" placeholder="Filtrar itens" autocomplete="off">
          </label>
          <button class="atlas-v2-button atlas-v2-button-quiet" type="button" data-action="filter"><i data-lucide="list-filter"></i><span>Filtrar</span></button>
          <button class="atlas-v2-button atlas-v2-button-quiet" type="button" data-action="sort"><i data-lucide="arrow-up-down"></i><span>Ordenar</span></button>
        </div>
        <div class="atlas-v2-toolbar-secondary">
          <button class="atlas-v2-icon-button" type="button" data-action="automations" title="Automações" aria-label="Automações"><i data-lucide="workflow"></i></button>
          <button class="atlas-v2-icon-button" type="button" data-action="import" title="Importar planilha" aria-label="Importar planilha"><i data-lucide="file-up"></i></button>
          <button class="atlas-v2-icon-button atlas-v2-field-mode-button" type="button" data-action="field-mode-toggle" title="Modo de campo" aria-label="Ativar modo de campo"><i data-lucide="smartphone"></i></button>
          <button class="atlas-v2-icon-button" type="button" data-action="fullscreen" title="Tela cheia" aria-label="Tela cheia"><i data-lucide="maximize-2"></i></button>
        </div>
      </section>

      <section class="atlas-v2-selection-bar" id="atlas-v2-selection-bar" hidden></section>

      <div class="atlas-v2-board-scroll" id="atlas-v2-board-scroll">
        <div class="atlas-v2-board-content" id="atlas-v2-board-content"></div>
      </div>

      <footer class="atlas-v2-footer">
        <span>Atlas · Smart Field Management · Criado por Túlio Radamés</span>
        <span id="atlas-v2-save-state"><i data-lucide="cloud-check"></i>Alterações salvas</span>
          <span>V2.1.0 Oficial</span>
      </footer>
    </main>
  </div>

  <div id="atlas-v2-overlay-root"></div>
  <div class="atlas-v2-toast-region" id="atlas-v2-toast-region" aria-live="polite"></div>

  <script src="config/config.js?v=2.1.0"></script>
  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/vendor/lucide.min.js"></script>
  <script src="assets/vendor/xlsx.full.min.js"></script>
  <script src="js/v2.js?v=2.1.0.1"></script>
</body>
</html>
